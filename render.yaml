# Render Blueprint: New → Blueprint → choose this repository → Apply.
services:
  - type: web
    name: inbox-arena
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build && npm run db:deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: inbox-arena-db
          property: connectionString
databases:
  - name: inbox-arena-db
    plan: free
